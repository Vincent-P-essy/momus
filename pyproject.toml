[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "momus"
version = "0.1.0"
description = "AI code-review agent that investigates before it judges — and only posts findings that survive cross-examination."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Vincent Plessy", email = "vincent.plessy12@gmail.com" }]
keywords = ["code-review", "ai", "agent", "github", "llm", "anthropic"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "anthropic>=0.92",
  "click>=8.1",
  "httpx>=0.27",
  "pydantic>=2.8",
  "rich>=13.7",
]

[project.scripts]
momus = "momus.cli:main"

[project.urls]
Homepage = "https://github.com/Vincent-P-essy/momus"
Issues = "https://github.com/Vincent-P-essy/momus/issues"

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/momus"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]
# Eval cases are deliberately buggy fixtures — the planted bugs are the point.
extend-exclude = ["evals/cases"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/momus"]

[[tool.mypy.overrides]]
module = ["anthropic", "anthropic.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["momus"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
